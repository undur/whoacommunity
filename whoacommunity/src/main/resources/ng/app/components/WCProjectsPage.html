<wo:WCLook>
	<wo:repetition list="$categories" item="$currentCategory">
	<div class="whoa-section project-section"><wo:str value="$currentCategory.title" /><span><wo:str value="$currentCategory.subtitle" /></span></div>
	<div class="project-grid">
		<wo:repetition list="$projectsInCurrentCategory" item="$currentProject">
			<wo:link href="$currentProjectURL" class="project-card">
				<div class="project-card-head">
					<span class="project-card-emoji"><wo:str value="$currentProject.emoji" /></span>
					<span class="project-card-name"><wo:str value="$currentProject.name" /></span>
					<wo:if condition="$currentProjectHasVersion">
						<span class="tree-tag"><wo:str value="$currentProjectVersion" /></span>
					</wo:if>
				</div>
				<p class="project-card-blurb"><wo:str value="$currentProjectBlurb" /></p>
			</wo:link>
		</wo:repetition>
	</div>
	</wo:repetition>
</wo:WCLook>
