<wo:link href="/dev-feed" class="rail-badge">
	<span class="live"></span>
	<span class="rail-badge-text"><span class="k">Development activity</span><span class="v">Commits, releases and issues, one stream →</span></span>
</wo:link>
<div class="rail-block">
	<div class="rail-head"><span class="live"></span>Commits<wo:link href="/dev-feed?tab=commits">all →</wo:link></div>
	<wo:repetition list="$items" item="$current">
		<wo:link href="$current.link" class="rail-row">
			<span class="rail-emoji"><wo:str value="$current.repo.emoji" /></span><span class="rail-repo"><wo:str value="$current.repo.name" /></span>
			<span class="rail-text-wrap"><wo:str value="$current.title" /></span>
			<span class="rail-when"><wo:str value="$current.shortDateFormatted" /></span>
		</wo:link>
	</wo:repetition>
</div>

<div class="rail-block">
	<div class="rail-head">Releases<wo:link href="/dev-feed?tab=releases">all →</wo:link></div>
	<wo:repetition list="$releases" item="$currentRelease">
		<wo:link href="$currentRelease.url" class="rail-row">
			<span class="rail-emoji"><wo:str value="$currentRelease.repo.emoji" /></span><span class="rail-repo"><wo:str value="$currentRelease.repo.name" /></span>
			<span class="rail-text rail-version"><wo:str value="$currentRelease.tagName" /></span>
			<span class="rail-when"><wo:str value="$currentRelease.shortDateFormatted" /></span>
		</wo:link>
	</wo:repetition>
</div>

<div class="rail-block">
	<div class="rail-head">Open issues<wo:link href="/dev-feed?tab=issues">all →</wo:link></div>
	<wo:repetition list="$openIssues" item="$currentIssue">
		<wo:link href="$currentIssue.url" class="rail-row">
			<span class="rail-emoji"><wo:str value="$currentIssue.repo.emoji" /></span><span class="rail-repo"><wo:str value="$currentIssue.repo.name" /></span>
			<span class="rail-text"><wo:str value="$currentIssue.title" /></span>
			<span class="rail-when"><wo:str value="$currentIssue.shortDateFormatted" /></span>
		</wo:link>
	</wo:repetition>
</div>

<div class="rail-block">
	<div class="rail-head">Latest articles<wo:link href="/writing">all →</wo:link></div>
	<wo:repetition list="$recentArticles" item="$currentArticle">
		<wo:link href="$currentArticleURL" class="rail-row">
			<wo:if condition="$currentArticle.published" negate="$true"><span class="post-tag">draft</span></wo:if>
			<span class="rail-text-wrap"><wo:str value="$currentArticle.title" /></span>
			<span class="rail-when"><wo:str value="$currentArticle.shortDateFormatted" /></span>
		</wo:link>
	</wo:repetition>
</div>

<wo:if condition="$isTrafficLoaded">
	<div class="rail-block rail-traffic">
		<div class="rail-head"><wo:if condition="$trafficHasNow"><span class="live"></span></wo:if>Visits<span class="rail-head-hint">last 30 days</span><wo:link href="$trafficDashboardURL" target="_blank" rel="noopener">dashboard ↗</wo:link></div>
		<div class="rail-chart"><wo:str value="$trafficSVG" escapeHTML="$false" /></div>
		<div class="rail-traffic-totals">
			<span><strong><wo:str value="$traffic.visits" /></strong> visits</span>
			<span><strong><wo:str value="$traffic.visitors" /></strong> visitors</span>
			<span><strong><wo:str value="$traffic.pageviews" /></strong> page views</span>
			<wo:if condition="$trafficHasNow"><span class="rail-traffic-now"><wo:str value="$trafficNowString" /></span></wo:if>
		</div>
	</div>
</wo:if>
