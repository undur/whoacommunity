<!doctype html>
<html lang="is">
	<head>
		<meta charset="utf-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
		<link rel="alternate" type="application/atom+xml" title="whoacommunity.com articles" href="https://www.whoacommunity.com/atom.xml" />
		<!-- Theme bootstrap runs before any stylesheet so there's no flash of the wrong theme.
		     First visit follows the OS; the choice then persists in localStorage. -->
		<script>
			(function () {
				try {
					var saved = localStorage.getItem( 'whoa-theme' );
					var sys = window.matchMedia( '(prefers-color-scheme: light)' ).matches ? 'light' : 'dark';
					document.documentElement.setAttribute( 'data-theme', saved || sys );
				}
				catch ( e ) {
					document.documentElement.setAttribute( 'data-theme', 'dark' );
				}
			})();
		</script>
		<!-- Preload the faces every page needs, so they start downloading before CSS parsing.
		     Note: font preloads require the crossorigin attribute even same-origin. -->
		<link rel="preload" href="/nr/app/fonts/inter-400-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/nr/app/fonts/jetbrains-mono-400-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
		<wo:stylesheet filename="tabler/css/tabler.min.css" />
		<wo:stylesheet filename="prism.css" />
		<wo:element elementName="link" rel="stylesheet" href="$whoaFontsCssURL" />
		<wo:element elementName="link" rel="stylesheet" href="$whoaCssURL" />
		<wo:script filename="ng-js.js" namespace="ng" />
		<title><wo:str value="$page.documentTitle" /></title>
		<wo:element elementName="meta" name="description" content="$page.pageDescription" />
		<wo:element elementName="link" rel="canonical" href="$page.canonicalURL" />
		<wo:element elementName="meta" property="og:site_name" content="whoacommunity" />
		<wo:element elementName="meta" property="og:type" content="website" />
		<wo:element elementName="meta" property="og:title" content="$page.documentTitle" />
		<wo:element elementName="meta" property="og:description" content="$page.pageDescription" />
		<wo:element elementName="meta" property="og:url" content="$page.canonicalURL" />
		<!-- Plausible (stats.rebbi.is), proxied through our own domain by ng-plausible; renders nothing in development -->
		<wo:NGPlausibleScript />
		<!-- FIXME: Hack for header width bug in tabler, see https://github.com/tabler/tabler/issues/2271 -->
		<style>
			@media (min-width: 992px) {
			  :host,
			  :root {
			    margin-left: 0;
			  }
			}

			body {
			  overflow-y: scroll;
			}
		</style>
	</head>
	<wo:container elementName="body" class="$bodyClass">
		<div class="whoa-shell">
			<aside class="whoa-aside" id="whoaAside">
				<div class="whoa-aside-head">
					<wo:link href="/" class="whoa-brand">
						<span class="whoa-brand-mark">W!</span>
						<span class="whoa-brand-text">whoacommunity<span class="whoa-brand-sub">WO · ng-objects</span></span>
					</wo:link>
					<button type="button" class="whoa-menu-toggle" aria-controls="whoaAside" aria-expanded="false" onclick="whoaToggleMenu(this)">Menu</button>
				</div>
				<wo:WCSiteTree />
				<a href="https://www.engifer.com/" class="whoa-powered" title="Powered by engifer, an homage to the 88×31 badges of the WebObjects era">
					<img class="whoa-powered-mark" src="/engifer.svg" alt="" width="20" height="20" />
					<span class="whoa-powered-text"><span class="k">Powered by</span><span class="v">e<span class="ng">ng</span>ifer</span></span>
				</a>
			</aside>

			<div class="whoa-main">
				<div class="whoa-topbar">
					<wo:WCBreadcrumbs />
					<div class="whoa-topbar-right">
						<wo:if condition="$session.isLoggedIn">
							<wo:form action="$search" autocomplete="off" novalidate>
								<wo:textfield value="$searchString" class="whoa-search-input" placeholder="Search…" aria-label="Search site" name="searchString" />
							</wo:form>
						</wo:if>
						<button type="button" class="whoa-theme-toggle" title="Switch theme" onclick="whoaToggleTheme()">☾</button>
					</div>
				</div>

				<div class="whoa-content">
					<wo:content />
				</div>

				<footer class="footer d-print-none">
					<p>This site runs on ng-objects. <a href="https://github.com/undur/whoacommunity">View its source on GitHub</a>.</p>
					<a class="maker" href="https://godurkodi.is/en/" hreflang="en">
						<span>Made by</span>
						<svg class="maker-mark" viewBox="-571.54 -324.06 1143.09 648.11" width="30" height="17" aria-hidden="true">
							<g class="maker-loop">
								<path d="M-133.64 -204.35 L-233.35 -304.06 A20 20 0 0 0 -261.63 -304.06 L-551.54 -14.14 A20 20 0 0 0 -551.54 14.14 L-261.63 304.06 A20 20 0 0 0 -233.35 304.06 L-9.90 80.61 L-80.61 9.90 L-247.49 176.78 L-424.26 0.00 L-247.49 -176.78 L-204.35 -133.64 Z"/>
								<path d="M-113.84 -43.13 L43.13 113.84 L113.84 43.13 L-43.13 -113.84 Z"/>
								<path d="M133.64 204.35 L233.35 304.06 A20 20 0 0 0 261.63 304.06 L551.54 14.14 A20 20 0 0 0 551.54 -14.14 L261.63 -304.06 A20 20 0 0 0 233.35 -304.06 L9.90 -80.61 L80.61 -9.90 L247.49 -176.78 L424.26 -0.00 L247.49 176.78 L204.35 133.64 Z"/>
							</g>
							<g fill="#d99a2b">
								<path d="M113.84 -204.35 L14.14 -304.06 A20 20 0 0 0 -14.14 -304.06 L-304.06 -14.14 A20 20 0 0 0 -304.06 14.14 L-204.35 113.84 L-133.64 43.13 L-176.78 0.00 L-0.00 -176.78 L43.13 -133.64 Z"/>
								<path d="M133.64 -43.13 L176.78 -0.00 L0.00 176.78 L-43.13 133.64 L-113.84 204.35 L-14.14 304.06 A20 20 0 0 0 14.14 304.06 L304.06 14.14 A20 20 0 0 0 304.06 -14.14 L204.35 -113.84 Z"/>
							</g>
						</svg>
						<strong>Góður kóði</strong>
					</a>
				</footer>
			</div>
		</div>

		<script>
			function whoaToggleMenu( button ) {
				const aside = document.getElementById( 'whoaAside' );
				const open = aside.classList.toggle( 'is-open' );
				button.setAttribute( 'aria-expanded', open ? 'true' : 'false' );
				button.textContent = open ? 'Close' : 'Menu';
			}

			function whoaToggleTheme() {
				var el = document.documentElement;
				var next = el.getAttribute( 'data-theme' ) === 'dark' ? 'light' : 'dark';
				el.setAttribute( 'data-theme', next );
				try { localStorage.setItem( 'whoa-theme', next ); } catch ( e ) {}
				whoaSyncThemeToggle();
			}

			function whoaSyncThemeToggle() {
				var dark = document.documentElement.getAttribute( 'data-theme' ) === 'dark';
				document.querySelectorAll( '.whoa-theme-toggle' ).forEach( function ( b ) { b.textContent = dark ? '☾' : '☀'; } );
			}

			whoaSyncThemeToggle();
		</script>
		<wo:script filename="tabler/js/tabler.min.js" defer></wo:script>
		<wo:script filename="prism.js" />
	</wo:container>
</html>
