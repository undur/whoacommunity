<!doctype html>
<html lang="is">
	<head>
		<meta charset="utf-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
		<link rel="alternate" type="application/atom+xml" title="whoacommunity.com articles" href="https://www.whoacommunity.com/atom.xml" />
		<!-- Theme bootstrap runs before any stylesheet so there's no flash of the wrong theme.
		     First visit follows the OS; the choice then persists in localStorage. -->
		<script>
			(function () {
				try {
					var saved = localStorage.getItem( 'whoa-theme' );
					var sys = window.matchMedia( '(prefers-color-scheme: light)' ).matches ? 'light' : 'dark';
					document.documentElement.setAttribute( 'data-theme', saved || sys );
				}
				catch ( e ) {
					document.documentElement.setAttribute( 'data-theme', 'dark' );
				}
			})();
		</script>
		<!-- Preload the faces every page needs, so they start downloading before CSS parsing.
		     Note: font preloads require the crossorigin attribute even same-origin. -->
		<link rel="preload" href="/nr/app/fonts/inter-400-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/nr/app/fonts/jetbrains-mono-400-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
		<wo:stylesheet filename="tabler/css/tabler.min.css" />
		<wo:stylesheet filename="prism.css" />
		<wo:stylesheet filename="whoa-fonts.css" />
		<wo:stylesheet filename="whoa.css" />
		<wo:script filename="ng-js.js" namespace="ng" />
		<title>Whoa! Community!</title>
		<!-- FIXME: Hack for header width bug in tabler, see https://github.com/tabler/tabler/issues/2271 -->
		<style>
			@media (min-width: 992px) {
			  :host,
			  :root {
			    margin-left: 0;
			  }
			}

			body {
			  overflow-y: scroll;
			}
		</style>
	</head>
	<wo:container elementName="body" class="$bodyClass">
		<div class="whoa-shell">
			<aside class="whoa-aside">
				<wo:link href="/" class="whoa-brand">
					<span class="whoa-brand-mark">W!</span>
					<span class="whoa-brand-text">whoacommunity<span class="whoa-brand-sub">WO · ng-objects</span></span>
				</wo:link>
				<wo:WCSiteTree />
				<a href="https://github.com/ngobjects/ng-objects" class="whoa-powered" title="Powered by ng-objects — an homage to the 88×31 badges of the WebObjects era">
					<span class="whoa-powered-mark">🚀</span>
					<span class="whoa-powered-text"><span class="k">Powered by</span><span class="v">ng-objects</span></span>
				</a>
			</aside>

			<div class="whoa-main">
				<div class="whoa-topbar">
					<wo:WCBreadcrumbs />
					<div class="whoa-topbar-right">
						<wo:if condition="$session.isLoggedIn">
							<wo:form action="$search" autocomplete="off" novalidate>
								<wo:textfield value="$searchString" class="whoa-search-input" placeholder="Search…" aria-label="Search site" name="searchString" />
							</wo:form>
						</wo:if>
						<button type="button" class="whoa-theme-toggle" title="Switch theme" onclick="whoaToggleTheme()">☾</button>
					</div>
				</div>

				<div class="whoa-content">
					<wo:content />
				</div>

				<footer class="footer d-print-none">
					<span><wo:str value="$envString" /></span>
					<span>WebObjects · wonder-slim · Cayenne · JDK 26</span>
				</footer>
			</div>
		</div>

		<script>
			function whoaToggleTheme() {
				var el = document.documentElement;
				var next = el.getAttribute( 'data-theme' ) === 'dark' ? 'light' : 'dark';
				el.setAttribute( 'data-theme', next );
				try { localStorage.setItem( 'whoa-theme', next ); } catch ( e ) {}
				whoaSyncThemeToggle();
			}

			function whoaSyncThemeToggle() {
				var dark = document.documentElement.getAttribute( 'data-theme' ) === 'dark';
				document.querySelectorAll( '.whoa-theme-toggle' ).forEach( function ( b ) { b.textContent = dark ? '☾' : '☀'; } );
			}

			whoaSyncThemeToggle();
		</script>
		<wo:script filename="tabler/js/tabler.min.js" defer></wo:script>
		<wo:script filename="prism.js" />
	</wo:container>
</html>
