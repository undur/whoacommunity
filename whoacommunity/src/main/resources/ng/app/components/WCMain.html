<wo:WCLook>
	<div class="row">
		<div class="col-md-8 article-list">
			<wo:repetition list="$articles" item="$currentArticle">
				<div class="card article-card">
					<div class="card-header dark-card-header">
						<h3 class="card-title">
							<wo:link href="$currentArticleURL"><wo:str value="$currentArticle.title" /></wo:link>
						</h3>
						<div class="card-actions">
							<small><wo:str value="$currentArticle.formattedDate" /></small>
							<wo:link href="$currentArticleCommentsURL" class="comment-count" title="Comments">💬 <wo:str value="$currentArticle.commentCount" /></wo:link>
						</div>
					</div>
					<div class="card-body">
						<wo:str value="$currentArticle.contentAsHTML" escapeHTML="$false" />
						<div class="article-footer">
							<wo:link href="$currentArticleCommentsURL" class="article-comments-link">
								<span class="bubble">💬</span>
								<wo:if condition="$currentArticle.hasComments">
									<span><strong><wo:str value="$currentArticle.commentCountString" /></strong> — join the discussion</span>
								</wo:if>
								<wo:if condition="$currentArticle.hasComments" negate="$true">
									<span>No comments yet — be the first</span>
								</wo:if>
								<span class="arrow">→</span>
							</wo:link>
						</div>
						<wo:if condition="$isLocal">
							<hr />
							<wo:link action="$editArticle" class="btn btn-primary">Edit</wo:link>
						</wo:if>
					</div>
				</div>
			</wo:repetition>
		</div>
		<div class="col-md-4 sidebar">
			<wo:WCSidebar />
		</div>
	</div>
</wo:WCLook>
