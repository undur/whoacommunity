<wo:WCLook>
	<wo:if condition="$hasLatestRelease">
		<div class="whoa-status">
			<wo:link href="$latestReleaseURL">
				<div class="k">Latest release</div>
				<div class="v"><wo:str value="$latestRelease.repo.name" /> <span class="unit"><wo:str value="$latestRelease.tagName" /></span></div>
				<div class="s"><wo:str value="$latestRelease.shortDateFormatted" /></div>
			</wo:link>
			<wo:link href="/dev-feed">
				<div class="k">Commits this week</div>
				<div class="v"><wo:str value="$commitCountThisWeek" /></div>
				<div class="s"><wo:str value="$activeRepoCountString" /></div>
			</wo:link>
			<wo:link href="/dev-feed?tab=issues">
				<div class="k">Open issues</div>
				<div class="v"><wo:str value="$openIssueCount" /></div>
				<div class="s"><wo:str value="$issuesOpenedThisMonthString" /></div>
			</wo:link>
		</div>
	</wo:if>

	<div class="whoa-grid">
		<div>
			<div class="whoa-section">Writing<wo:link href="/writing">All <wo:str value="$articleCount" /> articles →</wo:link></div>

			<wo:if condition="$hasLeadArticle">
				<article class="lead">
					<div class="lead-top">
						<span class="post-date"><wo:str value="$leadArticle.formattedDate" /></span>
						<wo:if condition="$leadArticle.published" negate="$true"><span class="post-tag">draft</span></wo:if>
					</div>
					<h1 class="lead-title">
						<wo:link href="$leadArticleURL"><wo:str value="$leadArticle.title" /></wo:link>
					</h1>
					<div class="article-body">
						<wo:str value="$leadArticle.contentAsHTML" escapeHTML="$false" />
					</div>
					<div class="lead-foot">
						<wo:link href="$leadArticleCommentsURL" class="lead-more">Discuss this article <span class="arrow">→</span></wo:link>
						<wo:if condition="$isLocal">
							<wo:link action="$editArticle" class="lead-edit">edit</wo:link>
						</wo:if>
						<wo:link href="$leadArticleCommentsURL" class="lead-comments"><wo:str value="$leadArticle.commentCountString" /></wo:link>
					</div>
				</article>
			</wo:if>

			<wo:repetition list="$olderArticles" item="$currentArticle">
				<wo:link href="$currentArticleURL" class="post">
					<div class="post-top">
						<span class="post-date"><wo:str value="$currentArticle.formattedDate" /></span>
						<wo:if condition="$currentArticle.published" negate="$true"><span class="post-tag">draft</span></wo:if>
						<wo:if condition="$currentArticle.hasComments"><span class="post-comments"><wo:str value="$currentArticle.commentCountString" /></span></wo:if>
					</div>
					<div class="post-title"><wo:str value="$currentArticle.title" /></div>
					<p class="post-teaser"><wo:str value="$currentArticle.teaser" /></p>
				</wo:link>
			</wo:repetition>
		</div>

		<div>
			<wo:WCSidebar />
		</div>
	</div>
</wo:WCLook>
