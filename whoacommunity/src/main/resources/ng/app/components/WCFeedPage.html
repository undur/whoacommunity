<wo:WCLook>
	<div class="feed-layout">
		<div>
			<div class="whoa-section">Development activity<a href="/atom.xml">Atom feed ↗</a></div>
			<wo:auc id="commitsUC" class="feed-table-wrap">
				<div class="feed-filter">
					<span>Showing <strong><wo:str value="$filterDescription" /></strong> — 50 most recent commits each</span>
					<wo:if condition="$hasFilter">
						<wo:aul action="$clearFilter" updateContainerID="commitsUC;reposUC" class="clear">clear filter</wo:aul>
					</wo:if>
				</div>
				<table class="feed-table">
					<thead>
						<tr><th>Repository</th><th>When</th><th>Message</th><th>Author</th></tr>
					</thead>
					<tbody>
						<wo:repetition list="$allCommits" item="$current">
							<tr>
								<td class="c-repo"><wo:str value="$current.repo.emoji" /> <wo:str value="$current.repo.name" /></td>
								<td class="c-when"><wo:str value="$current.shortDateFormatted" /></td>
								<td class="c-msg"><wo:link href="$current.link"><wo:str value="$current.title" /></wo:link></td>
								<td class="c-who"><wo:str value="$current.author" /></td>
							</tr>
						</wo:repetition>
					</tbody>
				</table>
			</wo:auc>
		</div>
		<div>
			<wo:auc id="reposUC" class="rail-block">
				<div class="rail-head">Filter by repository</div>
				<wo:repetition list="$groups" item="$currentGroup">
					<div class="rail-subhead"><wo:str value="$currentGroup.name" /></div>
					<ul class="repo-filter">
						<wo:repetition list="$currentGroup.repos" item="$currentRepo">
							<li>
								<wo:aul action="$selectRepo" updateContainerID="commitsUC;reposUC" class="$repoFilterClass">
									<span><wo:str value="$currentRepo.emoji" /></span>
									<span class="rail-text"><wo:str value="$currentRepo.name" /></span>
									<span class="n"><wo:str value="$currentRepoCommitCount" /></span>
								</wo:aul>
							</li>
						</wo:repetition>
					</ul>
				</wo:repetition>
			</wo:auc>
			<div class="note">Only the 50 most recent commits are fetched per repository, so this isn't the full history — it's what GitHub's feed gives us.</div>
		</div>
	</div>
</wo:WCLook>
